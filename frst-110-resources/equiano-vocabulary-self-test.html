<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equiano V–VI · Vocabulary self-test</title><style>
*{box-sizing:border-box}body{font:15px/1.35 system-ui,Arial,sans-serif;color:#182b31;background:#fafbf9;margin:0}main{max-width:1180px;margin:auto;padding:12px 24px}h1{font-size:24px;margin:4px 0}h2{font-size:18px;margin:8px 0}a{color:#125768}main>a{font-size:13px}main>p{margin:6px 0}.tabs{display:flex;gap:4px;border-bottom:1px solid #bdc8c9;margin:12px 0 8px;flex-wrap:wrap}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 12px}.tabs button[aria-pressed=true]{border-bottom-color:#175966;font-weight:700;color:#175966}section{margin:0;padding:0}section>h2{display:none}section>p{margin:6px 0 10px;font-size:14px}.matching{display:grid;grid-template-columns: minmax(260px, .85fr) minmax(360px,1.4fr);gap:32px}.row{min-height:30px;padding:1px 0;border-bottom:1px solid #e0e5e3;display:grid;grid-template-columns:34px 1fr;gap:0 8px;align-items:center}.row label{font-weight:600}input.letter,button{font:inherit;border:1px solid #687c80;border-radius:3px;background:white;color:#182b31}input.letter{width:32px;height:26px;text-align:center;text-transform:uppercase;margin:0;padding:0;font-size:16px}button{padding:7px 10px;cursor:pointer}button.primary{background:#175966;color:white}.definitions{margin:0;padding-left:25px}.definitions li{padding:4px 0 4px 3px;min-height:30px}.definitions li::marker{font-weight:700}.feedback{grid-column:2;margin:0;font-size:13px}.feedback:empty{display:none}.correct{color:#12602e}.wrong{color:#9d2c21}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.status{font-size:14px;font-weight:600;margin:4px 0}fieldset{border:0;padding:0 0 8px;margin:0;border-bottom:1px solid #dce2e1}legend{font-weight:650;padding-top:8px}fieldset label{display:inline-block;padding:6px 12px 6px 0}input[type=radio]{margin-right:6px}footer{font-size:12px;margin-top:16px;border-top:1px solid #bdc8c9;padding-top:8px}button:hover{filter:brightness(.94)}:focus-visible{outline:2px solid #175966;outline-offset:2px}::selection{background:#d3e8e9}[hidden]{display:none!important}@media(max-width:650px){main{padding:10px 12px}h1{font-size:21px}.matching{grid-template-columns:minmax(135px,.85fr) minmax(165px,1.15fr);gap:14px;font-size:13px}.row{grid-template-columns:30px 1fr;min-height:44px}input.letter{width:30px;height:36px}.definitions{padding-left:20px}.definitions li{min-height:44px;padding:5px 0}.tabs button{font-size:13px;padding:10px 7px}.actions button{font-size:13px;min-height:40px}.feedback{font-size:12px}fieldset label{display:block}.tabs{gap:0}}
</style><main><a href="../courses/frst-110.html">FRST 110</a><h1>Equiano V–VI: Vocabulary self-test</h1><p>20 items from chapters V–VI. Type matching letters; your answers stay when you switch sections.</p><nav class="tabs" aria-label="Quiz sections"></nav><div class="actions"><button class="primary" id="check">Check this section</button><button id="retry">Retry missed answers</button><button id="reset">Start over</button></div><p id="score" class="status" role="status" aria-live="polite">0 of 20 answered</p><form id="quiz"></form><footer>Source: Olaudah Equiano, <i>The Interesting Narrative</i>, Volume I, <a href="https://history.hanover.edu/texts/Equiano/equiano_ch5_a.html">Chapter V</a> and <a href="https://history.hanover.edu/texts/Equiano/equiano_ch6_a.html">Chapter VI</a>.</footer></main><script>
const data={"general": [["character", "Moral qualities; also reputation or recommendation"], ["Providence", "God’s care and guidance of events"], ["predestinarian", "Believer in outcomes determined beforehand"], ["integrity", "Honesty and adherence to moral commitments"], ["benevolence", "Kindness and concern for others’ welfare"], ["mistaken interest", "A mistaken view of one’s own advantage"], ["redress", "A remedy for an injustice"], ["milk of human kindness", "Natural compassion and generosity"], ["gall", "Bitterness or cruelty; literally, bitter bile"], ["insurrection", "An uprising against authority"]], "occupations": [["planters", "Owners or operators of plantations"], ["coopers", "Makers and repairers of barrels and casks"], ["masons", "Builders who work with stone or brick"], ["smiths", "Workers who shape metal"], ["mechanics", "Skilled manual workers or artisans"], ["clerks", "Workers handling records, accounts, or goods"], ["overseers", "Supervisors of enslaved plantation laborers"]], "items": [["1. “a very small <b>capital</b>” (VI)", ["a. a major city", "b. money available for trade", "c. an unpaid debt"]], ["2. “well <b>husbanded</b>” (VI)", ["a. carefully managed", "b. jointly owned", "c. recently borrowed"]], ["3. “<b>arbitrary</b> punishment” (V)", ["a. based on personal will, not fair rules", "b. mild", "c. accidental"]]]}; const quiz=document.querySelector('#quiz');const score=document.querySelector('#score');let questions=[];let checked=false;let active=0;
const orders={"general": [6, 7, 5, 1, 9, 0, 4, 2, 8, 3], "occupations": [2, 6, 4, 0, 3, 1, 5]};
function build(){questions=[];quiz.innerHTML='';checked=false;for(const [key,title] of [['general','Vocabulary'],['occupations','Occupations']]){
 const section=document.createElement('section');section.innerHTML=`<h2>${title}</h2><p>Type the matching letter. Use each letter once in this section.</p>`;
 const layout=document.createElement('div');layout.className='matching';const terms=document.createElement('div');const definitions=document.createElement('ol');definitions.className='definitions';definitions.type='A';definitions.setAttribute('aria-label',title+' definitions');
 orders[key].forEach(i=>{const li=document.createElement('li');li.textContent=data[key][i][1];definitions.append(li)});
 data[key].forEach(([term,meaning],i)=>{const id=key+i;const letter=String.fromCharCode(65+orders[key].indexOf(i));const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="letter" id="${id}" type="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="${id}-feedback"><label for="${id}">${i+1}. ${term}</label><p class="feedback" id="${id}-feedback"></p>`;terms.append(row);const el=row.querySelector('input');el.addEventListener('input',()=>{el.value=el.value.replace(/[^a-z]/gi,'').toUpperCase()});questions.push({el,value:()=>el.value.trim().toUpperCase(),clear:()=>el.value='',answer:letter,meaning:letter+'. '+meaning,feedback:row.querySelector('.feedback')})});layout.append(terms,definitions);section.append(layout);quiz.append(section)}const section=document.createElement('section');section.innerHTML='<h2>Meaning in context</h2>';data.items.forEach(([prompt,answers],i)=>{let field=document.createElement('fieldset');field.innerHTML=`<legend>${prompt}</legend>${answers.map((a,j)=>`<label><input type="radio" name="context${i}" value="${j}">${a}</label>`).join('')}<p class="feedback"></p>`;section.append(field);questions.push({el:field,value:()=>field.querySelector('input:checked')?.value??'',clear:()=>field.querySelectorAll('input').forEach(el=>el.checked=false),answer:String([1,0,0][i]),meaning:answers[[1,0,0][i]].slice(3),feedback:field.querySelector('.feedback')})});quiz.append(section);makeTabs();showSection(active);update()}
function makeTabs(){const nav=document.querySelector('.tabs');nav.innerHTML='';['Vocabulary · 10','Occupations · 7','Context · 3'].forEach((title,i)=>{const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=()=>showSection(i);nav.append(b)})}
function showSection(i){active=i;quiz.querySelectorAll('section').forEach((s,j)=>s.hidden=i!==j);document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}
function update(){if(checked){questions.forEach(q=>{q.feedback.textContent='';q.el.removeAttribute('aria-invalid')});checked=false}score.textContent=`${questions.filter(q=>q.value()!=='').length} of 20 answered`}
function check(){const section=quiz.querySelectorAll('section')[active];const subset=questions.filter(q=>section.contains(q.el));let correct=0;subset.forEach(q=>{const ok=q.value()===q.answer;correct+=ok;q.feedback.className='feedback '+(ok?'correct':'wrong');q.feedback.textContent=ok?'Correct':(q.value()===''?'Unanswered. ':'Not quite. ')+`Answer: ${q.meaning}`;q.el.setAttribute('aria-invalid',String(!ok))});checked=true;score.textContent=`This section: ${correct} / ${subset.length} correct · Overall: ${questions.filter(q=>q.value()===q.answer).length} / 20 correct`}
quiz.addEventListener('submit',e=>e.preventDefault());quiz.addEventListener('change',update);quiz.addEventListener('input',update);document.querySelector('#check').onclick=check;document.querySelector('#reset').onclick=build;document.querySelector('#retry').onclick=()=>{questions.forEach(q=>{if(q.value()!==q.answer)q.clear();q.feedback.textContent='';q.el.removeAttribute('aria-invalid')});checked=false;update();score.textContent+=' · Correct answers kept; retry the remaining items.'};build();
</script>
