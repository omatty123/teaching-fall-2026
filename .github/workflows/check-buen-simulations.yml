name: Check BUEN ethics simulations

on:
  push:
    paths:
      - 'buen-594-resources/ethics-simulations.html'
      - 'buen-594-resources/ethics-assets/**'
      - 'scripts/check-buen-simulations.mjs'
      - '.github/workflows/check-buen-simulations.yml'
  pull_request:
    paths:
      - 'buen-594-resources/ethics-simulations.html'
      - 'buen-594-resources/ethics-assets/**'
      - 'scripts/check-buen-simulations.mjs'
      - '.github/workflows/check-buen-simulations.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check prediction gates, branches, draft independence, and local links
        run: node --test scripts/check-buen-simulations.mjs
      - name: Check browser application syntax
        run: node --check buen-594-resources/ethics-assets/simulations.mjs
