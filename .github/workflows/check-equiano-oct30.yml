name: Check Equiano October 30 resources
on:
  push:
    paths:
      - 'frst-110-resources/equiano-chapters-3-4.html'
      - 'frst-110-resources/equiano-and-omar-ibn-said.html'
      - 'frst-110-resources/equiano-3-4-assets/**'
      - 'frst-110-resources/equiano-omar-assets/**'
      - 'scripts/build-equiano-3-4.py'
      - 'scripts/build-equiano-omar.py'
      - 'scripts/check-equiano-oct30.py'
      - 'data/frst-110.json'
      - '.github/workflows/check-equiano-oct30.yml'
  pull_request:
    paths:
      - 'frst-110-resources/equiano-chapters-3-4.html'
      - 'frst-110-resources/equiano-and-omar-ibn-said.html'
      - 'frst-110-resources/equiano-3-4-assets/**'
      - 'frst-110-resources/equiano-omar-assets/**'
      - 'scripts/*equiano*.py'
      - 'data/frst-110.json'
      - '.github/workflows/check-equiano-oct30.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check both pages and October30 links
        run: python scripts/check-equiano-oct30.py
      - name: Check map script syntax
        run: node --check frst-110-resources/equiano-3-4-assets/maps.js
