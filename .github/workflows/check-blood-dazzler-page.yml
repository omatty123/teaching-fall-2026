name: Check Blood Dazzler class page

on:
  push:
    paths:
      - 'frst-110-resources/blood-dazzler-oct-5.html'
      - 'frst-110-resources/blood-dazzler-words.html'
      - 'frst-110-resources/blood-dazzler-assets/**'
      - '_kit/blood-dazzler-*'
      - '_kit/vendor/leaflet/**'
      - 'scripts/build-blood-dazzler-page.py'
      - 'scripts/build-blood-dazzler-full-words.py'
      - 'scripts/blood_dazzler_word_graph.py'
      - 'scripts/check-blood-dazzler-page.py'
      - 'scripts/check-blood-dazzler-full-words.py'
      - '.github/workflows/check-blood-dazzler-page.yml'
  pull_request:
    paths:
      - 'frst-110-resources/blood-dazzler-oct-5.html'
      - 'frst-110-resources/blood-dazzler-words.html'
      - 'frst-110-resources/blood-dazzler-assets/**'
      - '_kit/blood-dazzler-*'
      - '_kit/vendor/leaflet/**'
      - 'scripts/build-blood-dazzler-page.py'
      - 'scripts/build-blood-dazzler-full-words.py'
      - 'scripts/blood_dazzler_word_graph.py'
      - 'scripts/check-blood-dazzler-page.py'
      - 'scripts/check-blood-dazzler-full-words.py'
      - '.github/workflows/check-blood-dazzler-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check classroom JavaScript syntax
        run: |
          node --check _kit/blood-dazzler-map.js
          node --check _kit/blood-dazzler-words.js
          node --check _kit/blood-dazzler-full-words.js
      - name: Build the class page
        run: |
          python scripts/build-blood-dazzler-page.py
          python scripts/build-blood-dazzler-full-words.py
      - name: Check reading, word evidence, media, local links, and generated HTML
        run: |
          python scripts/check-blood-dazzler-page.py --check-generated
          python scripts/check-blood-dazzler-full-words.py --check-generated
