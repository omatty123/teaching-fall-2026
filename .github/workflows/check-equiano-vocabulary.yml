name: Check Equiano vocabulary
on:
  push:
    paths: ['frst-110-resources/equiano-vocabulary-5-6.html', 'frst-110-resources/equiano-vocabulary-assets/**', 'scripts/*equiano-vocabulary.py', '.github/workflows/check-equiano-vocabulary.yml']
  pull_request:
    paths: ['frst-110-resources/equiano-vocabulary-5-6.html', 'frst-110-resources/equiano-vocabulary-assets/**', 'scripts/*equiano-vocabulary.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check-equiano-vocabulary.py
      - run: node --check frst-110-resources/equiano-vocabulary-assets/quiz.js
