<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Three Jewels and Four Noble Truths</title><desc id="desc">Buddha is the awakened teacher, Dharma the teaching, Sangha the community. Four Noble Truths within Dharma describe suffering, craving as its origin, cessation, and the Eightfold Path.</desc><style>@font-face{font-family:Source;src:url('../../../_kit/fonts/SourceSans3VF-Upright.woff2')}text{font-family:Source,Arial,sans-serif;fill:#202c30;font-size:25px}.heading{font-size:30px;font-weight:700}.label{font-size:24px;fill:#075d78;font-weight:650}.small{font-size:23px}.line{stroke:#9caaa9;stroke-width:1.5;fill:none}</style><rect width="1200" height="610" fill="#faf9f5"/><text x="20" y="38" class="heading">Three Jewels · the refuges</text><text x="20" y="99" class="heading">Buddha</text><text x="20" y="135">The awakened teacher</text><text x="450" y="99" class="heading">Dharma</text><text x="450" y="135">The teaching</text><text x="850" y="99" class="heading">Sangha</text><text x="850" y="135">The Buddhist community</text><path d="M512 155V190H20M512 190H1180" stroke="#a04c25" stroke-width="2" fill="none"/><text x="20" y="233" class="heading">Four Noble Truths · within the Dharma</text><text x="20" y="295" class="heading">1 · Suffering</text><text x="20" y="338">Dukkha: suffering and</text><text x="20" y="370">unsatisfactoriness</text><text x="20" y="413" class="label">Understand</text><text x="320" y="295" class="heading">2 · Origin</text><text x="320" y="338">Craving sustains</text><text x="320" y="370">suffering and rebirth</text><text x="320" y="413" class="label">Abandon craving</text><text x="620" y="295" class="heading">3 · Cessation</text><text x="620" y="338">Craving can cease;</text><text x="620" y="370">liberation is possible</text><text x="620" y="413" class="label">Realize cessation</text><text x="920" y="295" class="heading">4 · Path</text><text x="920" y="338">The Noble</text><text x="920" y="370">Eightfold Path</text><text x="920" y="413" class="label">Develop the path</text><path d="M1020 430V467H20M1020 467H1180" class="line"/><text x="20" y="510" class="heading">Wisdom</text><text x="20" y="548" class="small">Right view · intention</text><text x="400" y="510" class="heading">Ethical conduct</text><text x="400" y="548" class="small">Right speech · action · livelihood</text><text x="835" y="510" class="heading">Meditation</text><text x="835" y="548" class="small">Right effort · mindfulness</text><text x="835" y="580" class="small">· concentration</text></svg>