<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc"><title id="title">People and events, 200–650 CE</title><desc id="desc">A shared time scale compares China’s political events, the overlapping lives of Wang Xizhi and Huiyuan, and Silla’s conversion and petition to Sui. Mouzi’s text is not assigned a precise date.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#252e35;font-size:19px}.date{font-weight:700}.lane{font-weight:700;font-size:17px;fill:#50585e}.small{font-size:16px}.event{fill:#713744}.life{stroke:#236b72;stroke-width:7;stroke-linecap:round}.guide{stroke:#d9dcda;stroke-width:1;stroke-dasharray:3 6}.leader{stroke:#7a8588;stroke-width:1;fill:none}</style><line class="guide" x1="160.0" y1="43" x2="160.0" y2="475"/><text class="small" x="160.0" y="27" text-anchor="middle">200</text><line class="guide" x1="255.0" y1="43" x2="255.0" y2="475"/><text class="small" x="255.0" y="27" text-anchor="middle">250</text><line class="guide" x1="350.0" y1="43" x2="350.0" y2="475"/><text class="small" x="350.0" y="27" text-anchor="middle">300</text><line class="guide" x1="445.0" y1="43" x2="445.0" y2="475"/><text class="small" x="445.0" y="27" text-anchor="middle">350</text><line class="guide" x1="540.0" y1="43" x2="540.0" y2="475"/><text class="small" x="540.0" y="27" text-anchor="middle">400</text><line class="guide" x1="635.0" y1="43" x2="635.0" y2="475"/><text class="small" x="635.0" y="27" text-anchor="middle">450</text><line class="guide" x1="730.0" y1="43" x2="730.0" y2="475"/><text class="small" x="730.0" y="27" text-anchor="middle">500</text><line class="guide" x1="825.0" y1="43" x2="825.0" y2="475"/><text class="small" x="825.0" y="27" text-anchor="middle">550</text><line class="guide" x1="920.0" y1="43" x2="920.0" y2="475"/><text class="small" x="920.0" y="27" text-anchor="middle">600</text><line class="guide" x1="1015.0" y1="43" x2="1015.0" y2="475"/><text class="small" x="1015.0" y="27" text-anchor="middle">650</text><text class="small" x="1070" y="27">CE</text><text class="lane" x="0" y="102">CHINA</text><text class="lane" x="0" y="223">PEOPLE</text><text class="lane" x="0" y="405">SILLA / SUI</text><line class="leader" x1="160" y1="100" x2="1015" y2="100"/><line class="leader" x1="160" y1="405" x2="1015" y2="405"/><circle class="event" cx="198.0" cy="100" r="6"/><text x="198.0" y="75"><tspan class="date">220</tspan> · Han ends</text><circle class="event" cx="370.9" cy="100" r="6"/><path class="leader" d="M370.9 108 V130"/><text x="370.9" y="153"><tspan class="date">311</tspan> · Luoyang falls</text><line class="life" x1="355.7" y1="220" x2="465.9" y2="220"/><text x="355.7" y="200">Wang Xizhi · 303–361</text><line class="life" x1="414.6" y1="285" x2="570.4" y2="285"/><text x="414.6" y="265">Huiyuan · 334–416</text><circle class="event" cx="547.5999999999999" cy="285" r="6"/><path class="leader" d="M547.5999999999999 294 V310 H610"/><text x="620" y="302"><tspan class="date">404</tspan> · Huiyuan’s essay on royal homage</text><circle class="event" cx="781.3" cy="405" r="6"/><path class="leader" d="M781.3 397 V378 H645"/><text x="645" y="352"><tspan class="date">527</tspan> · Ich’adon’s martyrdom</text><text class="small" x="645" y="374">Silla’s conversion account</text><circle class="event" cx="935.1999999999999" cy="405" r="6"/><path class="leader" d="M935.1999999999999 413 V444 H735"/><text x="735" y="468"><tspan class="date">608</tspan> · Wŏn’gwang drafts petition</text><circle class="event" cx="942.8" cy="405" r="4"/><path class="leader" d="M942.8 399 V365 H997"/><text x="998" y="330" class="date">612 · Sui invades</text><text x="998" y="353">Koguryŏ</text></svg>